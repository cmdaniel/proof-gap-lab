[project]
name = "proofgap"
version = "0.1.0"
description = "A small experiment on where formal verification stops and tests must take over."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "z3-solver>=4.13",
    "hypothesis>=6.100",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofgap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
